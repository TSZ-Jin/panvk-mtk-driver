name: Build PanVK MTK Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build python3-pip python3-venv \
            clang llvm-dev libclang-dev \
            spirv-tools glslang-tools \
            rustc cargo libdrm-dev \
            wget unzip git patch \
            libclc-19-dev \
            python3-mako python3-yaml python3-packaging \
            libllvmspirvlib-18-dev \
            libudev-dev \
            libdisplay-info-dev

      - name: Upgrade Meson (Fix version error)
        run: |
          pip3 install "meson>=1.4.0"
          export PATH=$HOME/.local/bin:$PATH
          meson --version

      - name: Setup Rust and bindgen
        run: |
          rustup target add aarch64-linux-android
          cargo install bindgen-cli
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Driver (Run build.sh with fix)
        run: |
          chmod +x build.sh
          
          # 【关键修复】自动修改 build.sh，在应用补丁后复制缺失的 panvk_drm_stub.c 文件
          # 假设文件在仓库根目录或 driver 目录下
          REPO_ROOT=${{ github.workspace }}
          
          # 在 build.sh 的 'git apply' 行之后插入复制命令
          # 这样当 build.sh 克隆并打完补丁后，会自动把文件复制过去
          sed -i "/git apply.*panvk_mtk.patch/a \cp ${REPO_ROOT}/panvk_drm_stub.c ~/panvk-mtk/mesa/src/panfrost/vulkan/ 2>/dev/null || cp ${REPO_ROOT}/driver/panvk_drm_stub.c ~/panvk-mtk/mesa/src/panfrost/vulkan/ 2>/dev/null || echo 'Warning: Stub file not found, build may fail'" build.sh
          
          # 自动修改 build.sh 内部的旧包名
          sed -i 's/libclc-dev/libclc-19-dev/g' build.sh
          
          export PATH=$HOME/.local/bin:$PATH
          
          # 强制使用 Clang 编译器
          export CC=clang
          export CXX=clang++
          
          bash build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-mali-mt6895
          path: driver/vulkan.mali.so
          retention-days: 7
